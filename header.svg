  <line x1="760" y1="68" x2="868" y2="68" stroke="#35393d" stroke-width="1" opacity="0.15"/>

  <circle cx="800" cy="124" r="2" fill="#47645f" opacity="0.2"/>
  <circle cx="820" cy="144" r="1.5" fill="#bd9b88" opacity="0.2"/>
  <circle cx="840" cy="114" r="1.5" fill="#a8a39c" opacity="0.15"/>
