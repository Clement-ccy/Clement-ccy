      <stop offset="0%" stop-color="#1f2124"/>
      <stop offset="100%" stop-color="#2a2d31"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#47645f"/>
      <stop offset="100%" stop-color="#bd9b88"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative dots -->
  <circle cx="32" cy="28" r="3" fill="#47645f" opacity="0.5"/>
  <circle cx="44" cy="28" r="2" fill="#bd9b88" opacity="0.35"/>

